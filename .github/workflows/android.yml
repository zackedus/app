name: Android test and APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Generate Android project
        run: bash setup.sh
      - name: Analyze and test
        working-directory: object_detection
        run: |
          flutter analyze
          flutter test
      - name: Build debug APK
        working-directory: object_detection
        run: |
          flutter build apk --debug --target-platform android-arm64
          python3 ../scripts/check_16kb.py build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deteksi-objek-android-arm64
          path: object_detection/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
