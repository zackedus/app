name: Android signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_RELEASE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Set ANDROID_RELEASE_KEYSTORE_BASE64 first.'; exit 1; }
          umask 077
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/deteksi-objek-release.jks"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Generate Android project
        run: bash setup.sh
      - name: Analyze and test
        working-directory: object_detection
        run: |
          flutter analyze
          flutter test
      - name: Build and verify signed release APK
        working-directory: object_detection
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" &&
            test -n "$ANDROID_KEY_PASSWORD" && test -n "$EXPECTED_CERT"
          flutter build apk --release --target-platform android-arm64 --build-number "$GITHUB_RUN_NUMBER"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$signer"
          apk=build/app/outputs/flutter-apk/app-release.apk
          actual="$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$actual"
          test "${actual,,}" = "${EXPECTED_CERT,,}" || { echo 'Release certificate differs from the configured certificate.'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: deteksi-objek-release-arm64
          path: object_detection/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: test -z "${ANDROID_KEYSTORE_PATH:-}" || rm -f -- "$ANDROID_KEYSTORE_PATH"
