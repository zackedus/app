name: Android signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_RELEASE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Set ANDROID_RELEASE_KEYSTORE_BASE64 first.'; exit 1; }
          umask 077
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/deteksi-objek-release.p12"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Generate Android project
        run: bash setup.sh
      - name: Analyze and test
        working-directory: object_detection
        run: |
          flutter analyze
          flutter test
      - name: Build and verify signed release APK
        working-directory: object_detection
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: deteksi-objek-release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" &&
            test -n "$ANDROID_KEY_PASSWORD" && test -n "$EXPECTED_CERT"
          keytool -list -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          flutter build apk --release --target-platform android-arm64 --build-number "$GITHUB_RUN_NUMBER"
          apk=build/app/outputs/flutter-apk/app-release.apk
          python3 ../scripts/check_16kb.py "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is unavailable}}"
          signer="$sdk/build-tools/35.0.0/apksigner"
          if [ ! -x "$signer" ]; then
            "$sdk/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
          test -x "$signer" || { echo 'Android apksigner is unavailable.'; exit 1; }
          report="$("$signer" verify --print-certs "$apk")"
          printf '%s\n' "$report"
          actual="$(printf '%s\n' "$report" | awk -F ': ' '/certificate SHA-256 digest:/ { print $2; exit }')"
          test -n "$actual" || { echo 'No signer certificate fingerprint in APK.'; exit 1; }
          test "${actual,,}" = "${EXPECTED_CERT,,}" || { echo 'Release certificate differs from the configured certificate.'; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deteksi-objek-release-arm64
          path: object_detection/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: test -z "${ANDROID_KEYSTORE_PATH:-}" || rm -f -- "$ANDROID_KEYSTORE_PATH"
